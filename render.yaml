services:
  - type: web
    name: netcoop-api
    runtime: python
    plan: free
    buildCommand: pip install -e ".[api]"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NETCOOP_DB_PATH
        value: /tmp/netcoop.db
      - key: NETCOOP_LLM_MODEL
        value: ""
      - key: NETCOOP_CORS_ORIGINS
        sync: false
  - type: web
    name: netcoop-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
