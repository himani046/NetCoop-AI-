[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "netcoop-ai"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3", "langgraph>=0.2", "langchain-core>=0.3", "langchain>=0.3", "streamlit>=1.36"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
